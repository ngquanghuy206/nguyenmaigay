<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — NKHN Mail Filter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="logo-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="4" width="20" height="16" rx="3" fill="#4a90e2"/>
          <path d="M2 8l9.293 5.707a1 1 0 001.414 0L22 8" stroke="#fff" stroke-width="1.5" fill="none"/>
          <line x1="2" y1="8" x2="11.5" y2="13.5" stroke="#fff" stroke-width="1.5"/>
          <line x1="22" y1="8" x2="12.5" y2="13.5" stroke="#fff" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="logo-title">NKHN</div>
      <div class="logo-sub">Tool lọc mail theo domain</div>
      <div class="logo-sub" style="margin-top:3px; font-size:11px; color:#ccc;">
        by Admin Nguyễn Hoàng Khánh Nam
      </div>
    </div>

    <div class="auth-title">Đăng nhập</div>

    <!-- Social login -->
    <div class="social-row">
      <button class="btn btn-outline btn-google" id="btnGoogle" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Đăng nhập bằng Google
      </button>
      <button class="btn btn-outline btn-facebook" id="btnFacebook" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.791-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
        Đăng nhập bằng Facebook
      </button>
    </div>

    <div class="auth-divider">hoặc đăng nhập bằng email</div>

    <!-- Login form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:middle"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          Email
        </label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="loginPassword">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:middle"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Mật khẩu
        </label>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" autocomplete="current-password">
          <button type="button" class="pw-toggle" title="Hiện/ẩn mật khẩu">
            <svg class="ico-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ico-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="loginSubmit" type="submit">Đăng nhập</button>
    </form>

    <div class="auth-switch">
      Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
    </div>

  </div>
</div>

<div id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    Storage.redirectIfAuth('index.html');
  });
</script>
</body>
</html>
